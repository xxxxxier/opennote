name: Quality Check - Frontend

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
    
  flutter-check:
    name: Flutter Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Build (compile check)
        run: flutter build web --debug